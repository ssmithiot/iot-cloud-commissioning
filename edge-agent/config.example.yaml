gateway_id: UNPROVISIONED
site_id: UNPROVISIONED
cloud_url: http://localhost:8000
tunnel_enabled: true
local_ui_url: http://127.0.0.1:5000
edge_ui_data_dir: /home/swadmin/edge-bacnet-ui-v2/data
# Local Edge trends are enabled by default from 0.2.0. The Edge UI must also
# have EDGE_TRENDS_UI_ENABLED=1; setting only one gate produces a trend
# interface with no samples, or samples with no interface.
local_edge_trends_enabled: true
# Maximum time for a cloud-relayed request to complete at the local gateway UI.
# The WebSocket connection/reconnect timeout remains 30 seconds.
tunnel_request_timeout_sec: 900
# Maximum time for an edge-agent write job to wait on the loopback-only local UI adapter.
local_ui_write_timeout_sec: 120
# Prefer setting GATEWAY_API_TOKEN in the environment instead of this file.
# gateway_api_token: iotcc_gw_<token_prefix>_<secret>
# EDGE_AGENT_WRITE_TOKEN is a gateway-local shared secret. Set it in the service
# environment for both the edge agent and the local UI; do not send it to the cloud.
# edge_agent_write_token: replace-with-a-long-random-local-token
# Router profiles:
# - contemporary or basrtb: Contemporary Controls / BASRT-B commissioning on UDP 47814.
# - bac-rtr: BAC-RTR commissioning on UDP 47809.
# - custom: use bacnet.default_port or BACNET_IP_PORT exactly.
# BACNET_IP_PORT in the service environment overrides these profile defaults.
bacnet_default_port: 47814
# Low-bandwidth normal operation: heartbeats establish liveness every two
# hours; commands use a separate, renewable 10 minute long-poll.
heartbeat_interval_sec: 7200
command_wait_timeout_sec: 600
command_failure_backoff_initial_sec: 5
command_failure_backoff_max_sec: 300
# Trend samples stay local until the cloud acknowledges them. These bounds keep
# an offline gateway from consuming unlimited disk while preserving the oldest
# pending sample for a later retry.
trend_upload_batch_size: 100
trend_transport_mode: edge_local
trend_sync_interval_sec: 7200
trend_queue_max_pending_samples: 10000
trend_upload_retry_base_sec: 30
trend_upload_retry_max_sec: 900
# Trend collection must never slow a live read or a write. A trend batch waits
# only this long for the BACnet runtime lock before deferring to the next agent
# cycle; operator work keeps the full bacnet.lock_timeout_sec.
trend_lock_timeout_sec: 2
# Points per BACnet trend request. The runtime lock is released between
# batches so live work can interleave.
trend_read_batch_size: 8
# Upper bound on trend points read in one agent cycle.
trend_max_points_per_cycle: 200
# Local trend samples uploaded to the cloud mirror per agent cycle.
trend_local_upload_batch_size: 200
# agent_version is read from the installed edge app package and cannot be overridden here.
ui_version: 0.1.0
bacnet:
  router_profile: contemporary
  default_port: 47814
  bacwi_path: bacwi
  bacrp_path: bacrp
  bacrpm_path: bacrpm
  # Omit lock_path for the standard per-port lock:
  # /tmp/iot-edge-bacnet-<port>.lock
  # Or set lock_path to a directory for custom per-port lock files.
  timeout_sec: 10
  lock_timeout_sec: 30
  lock_stale_sec: 120
# For local development, override the default /var/lib/iot-cx-agent/edge.db:
# sqlite_path: ./edge.db
